name: Vigilay checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vigilay_test
          MYSQL_USER: vigilay
          MYSQL_PASSWORD: ci_only_test_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://vigilay:ci_only_test_password@127.0.0.1:3306/vigilay_test?charset=utf8mb4
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: ruff check apps/api services/camera-adapters tests
      - run: ruff format --check apps/api services/camera-adapters tests
      - run: pytest
      - run: pip-audit --local --skip-editable
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run check && npm run build && npm audit
        working-directory: apps/web
  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: api, context: '.', file: infra/docker/api.Dockerfile}
          - {name: web, context: apps/web, file: apps/web/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vigilay-${{ matrix.name }}
          tags: type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-web-magic-container:
    needs: images
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Bunny deployment configuration
        env:
          BUNNY_APP_ID: ${{ vars.BUNNYNET_APP_ID || secrets.BUNNYNET_APP_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: |
          if [ -z "$BUNNY_APP_ID" ]; then
            echo "::error::BUNNYNET_APP_ID no está disponible como variable o secreto del repositorio."
            exit 1
          fi
          if [ -z "$BUNNY_API_KEY" ]; then
            echo "::error::BUNNYNET_API_KEY no está disponible como secreto del repositorio."
            exit 1
          fi
      - name: Update Vigilay Web in Magic Containers
        id: bunny_update
        continue-on-error: true
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNYNET_APP_ID || secrets.BUNNYNET_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: web
          image_name: developerlhc/vigilay-web
          image_tag: ${{ github.sha }}
      - name: Retry Bunny update after transient API failure
        if: steps.bunny_update.outcome == 'failure'
        env:
          BUNNY_APP_ID: ${{ vars.BUNNYNET_APP_ID || secrets.BUNNYNET_APP_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          app_json="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 10 \
            --silent --show-error \
            --header "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/mc/apps/$BUNNY_APP_ID")"
          container_id="$(printf '%s' "$app_json" | jq -r \
            '.containerTemplates[] | select(.name == "web") | .id' | head -n 1)"
          if [ -z "$container_id" ] || [ "$container_id" = "null" ]; then
            echo '::error::Bunny no devolvió el contenedor web.'
            exit 1
          fi

          payload="$(jq -cn --arg id "$container_id" --arg tag "$IMAGE_TAG" \
            --arg name 'developerlhc/vigilay-web' \
            '{id: $id, imageTag: $tag, imageName: $name}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --output "$response_file" \
              --write-out '%{http_code}' --request PATCH \
              --header 'Content-Type: application/json' \
              --header "AccessKey: $BUNNY_API_KEY" \
              --data "$payload" \
              "https://api.bunny.net/mc/apps/$BUNNY_APP_ID/containers/$container_id")"
            if [ "$status" = "200" ]; then
              echo "Bunny aceptó la actualización en el intento $attempt."
              exit 0
            fi
            if [ "$status" != "429" ] && [ "${status#5}" = "$status" ]; then
              echo "::error::Bunny rechazó la actualización con HTTP $status."
              exit 1
            fi
            echo "::warning::Bunny respondió HTTP $status; reintento $attempt de 5."
            sleep $((attempt * 10))
          done
          echo '::error::Bunny continuó indisponible después de cinco intentos.'
          exit 1
