name: Vigilay checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  VIGILAY_VERSION: 0.2.1

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vigilay_test
          MYSQL_USER: vigilay
          MYSQL_PASSWORD: ci_only_test_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://vigilay:ci_only_test_password@127.0.0.1:3306/vigilay_test?charset=utf8mb4
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: ruff check apps/api services/camera-adapters apps/desktop/resources tests
      - run: ruff format --check apps/api services/camera-adapters apps/desktop/resources tests
      - run: pytest
      - run: pip-audit --local --skip-editable
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run check && npm run build && npm audit
        working-directory: apps/web
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/local.Dockerfile
          load: true
          tags: vigilay-local:smoke
          cache-from: type=gha,scope=local
          cache-to: type=gha,scope=local,mode=max
      - name: Smoke test Local without real database or cameras
        run: |
          docker run -d --name local-smoke --init -p 127.0.0.1:5002:5000 \
            -e CAMERA_STORAGE=env --cap-drop ALL --security-opt no-new-privileges:true vigilay-local:smoke
          python scripts/smoke_local_container.py
      - name: Local logs
        if: failure()
        run: docker logs local-smoke || true
      - name: Stop test container
        if: always()
        run: docker rm -f local-smoke || true
  images:
    needs: [backend, web, local]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: api, context: '.', file: infra/docker/api.Dockerfile}
          - {name: web, context: apps/web, file: apps/web/Dockerfile}
          - {name: local, context: '.', file: infra/docker/local.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vigilay-${{ matrix.name }}
          tags: |
            type=raw,value=v${{ env.VIGILAY_VERSION }}-build-${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
