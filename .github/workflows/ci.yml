name: Vigilay checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vigilay_test
          MYSQL_USER: vigilay
          MYSQL_PASSWORD: ci_only_test_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://vigilay:ci_only_test_password@127.0.0.1:3306/vigilay_test?charset=utf8mb4
      CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: ruff check apps/api services/camera-adapters tests
      - run: ruff format --check apps/api services/camera-adapters tests
      - run: pytest
      - run: pip-audit --local --skip-editable
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run check && npm run build && npm audit
        working-directory: apps/web
  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: api, context: '.', file: infra/docker/api.Dockerfile}
          - {name: web, context: apps/web, file: apps/web/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vigilay-${{ matrix.name }}
          tags: type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-web-magic-container:
    needs: images
    if: github.event_name == 'push' && vars.BUNNYNET_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Update Vigilay Web in Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNYNET_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: web
          image_tag: ${{ github.sha }}
