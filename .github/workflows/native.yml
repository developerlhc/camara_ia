name: Vigilay Mobile and Desktop
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'apps/desktop/**', 'tools/**', 'scripts/build-desktop-recorder.ps1', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'apps/desktop/**', 'tools/**', 'scripts/build-desktop-recorder.ps1', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci && npm test && npm run build && npm audit && npx cap sync android
        working-directory: apps/mobile
      - name: Build and lint Android
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lint --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: Vigilay-Mobile-Android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: tools/vigilay_recorder/requirements-build.txt}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.94.0', components: rustfmt}
      - run: python -m pip install -r tools/vigilay_recorder/requirements-build.txt
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm audit
        working-directory: apps/desktop
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        working-directory: apps/desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        working-directory: apps/desktop
      - run: python -m pytest tools/vigilay_recorder/test_config.py tools/v380_motion_recorder/test_recorder.py -q
      - run: npm run desktop:build -- --bundles nsis,msi
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: Vigilay-Desktop-Windows-installers-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
