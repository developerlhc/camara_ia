name: vigilay

x-api-environment: &api-environment
  APP_ENV: development
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-vigilay}:${MYSQL_PASSWORD:-vigilay-local-development}@mysql:3306/${MYSQL_DATABASE:-vigilay}?charset=utf8mb4
  BDMYSQL: ${BDMYSQL:-}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-2}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
  SESSION_SECRET: ${SESSION_SECRET:?Configura .env}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Configura .env}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  VIGILAY_API_URL: ${VIGILAY_API_URL:-http://localhost:8000}
  VIGILAY_REALTIME_URL: ${VIGILAY_REALTIME_URL:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-false}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_STREAM_API_TOKEN: ${CLOUDFLARE_STREAM_API_TOKEN:-}
  FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
  FRIGATE_API_URL: ${FRIGATE_API_URL:-http://frigate:5000}
  FRIGATE_RESTREAM_URL: ${FRIGATE_RESTREAM_URL:-rtsp://frigate:8554}
  FRIGATE_TIMEOUT_SECONDS: ${FRIGATE_TIMEOUT_SECONDS:-10}
  FRIGATE_GATEWAY_PORT: ${FRIGATE_GATEWAY_PORT:-8788}
  CLOUDFLARED_PATH: ${CLOUDFLARED_PATH:-cloudflared}
  STREAM_IDLE_TIMEOUT_SECONDS: ${STREAM_IDLE_TIMEOUT_SECONDS:-300}
  STREAM_START_TIMEOUT_SECONDS: ${STREAM_START_TIMEOUT_SECONDS:-15}
  STREAM_LIVE_HEIGHT: ${STREAM_LIVE_HEIGHT:-720}
  STREAM_LIVE_FPS: ${STREAM_LIVE_FPS:-15}
  STREAM_LIVE_BITRATE_KBPS: ${STREAM_LIVE_BITRATE_KBPS:-2000}
  STREAM_ENCODER_THREADS: ${STREAM_ENCODER_THREADS:-2}

services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vigilay}
      MYSQL_USER: ${MYSQL_USER:-vigilay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vigilay-local-development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vigilay-root-local-development}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    image: vigilay-api:local
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql: {condition: service_healthy}
  api:
    image: vigilay-api:local
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment:
      <<: *api-environment
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-environment
    command: ["vigilay-worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "from datetime import timedelta; from vigilay.db import system_session; from vigilay.models import ServiceHeartbeat,utcnow; c=system_session(); db=c.__enter__(); h=db.get(ServiceHeartbeat,'worker'); assert h and h.last_seen_at >= utcnow()-timedelta(seconds=30); c.__exit__(None,None,None)"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  frigate-gateway:
    build: {context: ., dockerfile: infra/docker/frigate-gateway.Dockerfile}
    environment: *api-environment
    volumes: ["./.local:/app/.local:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: {context: apps/web, dockerfile: Dockerfile}
    environment:
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      HOST: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:8000
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  mediamtx:
    image: bluenviron/mediamtx:1.15.6
    profiles: ["media"]
    # Kept private until live-session authorization is implemented.
    volumes: ["./services/media/mediamtx.yml:/mediamtx.yml:ro"]
    restart: unless-stopped

  vigilay-local:
    image: ${VIGILAY_LOCAL_IMAGE:-vigilay-local:local}
    build: {context: ., dockerfile: infra/docker/local.Dockerfile}
    profiles: ["local"]
    init: true
    environment:
      <<: *api-environment
      CAMERA_STORAGE: mysql
      LOCAL_AI_ENABLED: "false"
      START_STREAM_AGENT_WITH_LOCAL: "false"
      VIGILAY_API_URL: ${VIGILAY_LOCAL_API_URL:-http://api:8000}
      FRIGATE_RESTREAM_URL: ${VIGILAY_LOCAL_RESTREAM_URL:-rtsp://frigate:8554}
      V380_EXTERNAL_BRIDGE_HOST: ${V380_EXTERNAL_BRIDGE_HOST:-host.docker.internal}
      VIGILAY_LOCAL_LAN_CIDR: ${VIGILAY_LOCAL_LAN_CIDR:-}
      FFMPEG_PATH: ffmpeg
    ports: ["127.0.0.1:${VIGILAY_LOCAL_PORT:-5000}:5000"]
    volumes: ["./.local:/app/.local"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  mysql_data:
  media_data:
