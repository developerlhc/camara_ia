[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilay"
version = "0.1.0"
description = "Vigilay multi-tenant surveillance control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "pymysql[rsa]>=1.1,<2", "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26", "cryptography>=50.0.1,<51",
  "httpx>=0.28,<1", "email-validator>=2.2,<3",
  "onvif-zeep>=0.2.12,<1",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
vigilay = "vigilay.cli:main"
vigilay-worker = "vigilay.worker:main"
vigilay-stream-agent = "vigilay.stream_agent:main"
vigilay-frigate-gateway = "vigilay.frigate_gateway:main"

[tool.setuptools.packages.find]
where = ["apps/api/src", "services/camera-adapters/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
